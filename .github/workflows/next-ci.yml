name: Portfolio — build, SEO and localized routes
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify public assets, sitemap and all localized case-study routes
        run: |
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/meta/portfolio-social.png
          test -f out/meta/mark.svg
          test -f out/cv/Taha_Zitane_CV_2026.pdf
          for prefix in "" "fr/" "ar/"; do
            test -f "out/${prefix}index.html"
            for section in projects experience education expertise services contact; do
              test -f "out/${prefix}${section}/index.html"
            done
            for slug in enterprise-network-lab windows-server-ad remote-it-support hospital-network-support security-observability-labs firewall-ipsec-lab proxmox-virtualization-lab cisco-campus-network-lab; do
              test -f "out/${prefix}projects/${slug}/index.html"
            done
          done

      - name: Run link, locale and accessibility smoke checks
        run: node scripts/site-smoke.mjs

      - name: Browser UX, interactions and mobile layout
        run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
