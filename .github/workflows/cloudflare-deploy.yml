name: Publish portfolio to Cloudflare Workers

# GitHub CI tests the exported Next.js site but does not publish it.
# This workflow builds and deploys the exact contents of main to the public Worker.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish static portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Cloudflare deployment not configured::Add GitHub Actions secret CLOUDFLARE_API_TOKEN (Workers Scripts Edit + account permission) in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare deployment not configured::Add GitHub Actions secret CLOUDFLARE_ACCOUNT_ID from the Cloudflare dashboard."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check, build and validate all localized routes
        run: npm run check
      - name: Publish static assets to Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: npx --yes wrangler@4 deploy
      - name: Record production endpoint
        if: success()
        run: |
          echo "### Cloudflare portfolio deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Published \`\${GITHUB_SHA}\` to **taha-zitane-engineering**." >> "$GITHUB_STEP_SUMMARY"
          echo "Production: https://taha-zitane-engineering.zitanet44.workers.dev/" >> "$GITHUB_STEP_SUMMARY"
